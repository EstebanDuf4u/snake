services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-snake}
      MARIADB_USER: ${DB_USER:-snake}
      MARIADB_PASSWORD: ${DB_PASS:-snakepass}
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/models.sql:/docker-entrypoint-initdb.d/models.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "${DB_USER:-snake}", "-p${DB_PASS:-snakepass}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-snake}
      DB_USER: ${DB_USER:-snake}
      DB_PASS: ${DB_PASS:-snakepass}
    volumes:
      - ./backend:/app
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  front:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  dbdata:

networks:
  default: